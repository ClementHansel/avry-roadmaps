version: '3.8'

services:
  avry_roadmap:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: avry-roadmaps
    ports:
      - "8084:8084"
    environment:
      - PORT=8084
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - DATABASE_URL=${DATABASE_URL}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET}
      - JWT_SECRET=${JWT_SECRET}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - aivory-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.avry-roadmaps.rule=Host(`backend.aivory.id`) && PathPrefix(`/roadmaps`)"
      - "traefik.http.routers.avry-roadmaps.entrypoints=websecure"
      - "traefik.http.routers.avry-roadmaps.tls.certresolver=letsencrypt"
      - "traefik.http.services.avry-roadmaps.loadbalancer.server.port=8084"

networks:
  aivory-network:
    name: aivory-network
    external: true
